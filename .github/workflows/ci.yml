# CI: verify.sh --all を 3 OS の stable で実行し、Linux の MSRV 1.88 でビルドとテストを確認する。
# 検証の内容は .claude/scripts/verify.sh が正（ここに cargo のコマンドを足さない。MSRV ジョブだけ例外）。
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: bash .claude/scripts/verify.sh --all
      - run: git diff --exit-code -- Cargo.lock
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features
      - run: git diff --exit-code -- Cargo.lock
